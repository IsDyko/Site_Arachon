<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="medias/css/contact.css" />
		<link rel="stylesheet" href="medias/css/main_params.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700&family=Gabarito+SemiCondensed:wght@400;500;600;700&family=Gabarito+Condensed:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
			crossorigin="anonymous"
			referrerpolicy="no-referrer"
		/>
		<title>Arachon</title>
		<link
			rel="icon"
			href="medias/images/favicon-32x32.png"
			type="image/x-icon"
		/>
	</head>
	<body>
		<header>
			<nav>
				<img src="medias/images/logotrans.png" alt="logo" class="logo" />
				<div class="menu_choices">
					<ul>
						<li><a href="./index.html">Accueil</a></li>
						<li><a href="">Presentation</a></li>
						<li><a href="./contact.html">Contact</a></li>
					</ul>
				</div>
				<div class="other_buttons">
					<button class="loc">
						<i class="fa-solid fa-location-dot"></i
						><span>Trouver un concessionnaire</span>
					</button>
					<button class="signup"><i class="fa-solid fa-user"></i></button>
				</div>
			</nav>
		</header>
		<main>
			<h1>Contactez-nous</h1>
			<p>
				Pour toute question ou demande d'information, n'hésitez pas à nous
				contacter via le formulaire ci-dessous ou par téléphone au +41 76 123 45
				67 89.
			</p>
			<form class="contact_form">
				<div class="name">
					<!-- <label for="name">Nom :</label> -->
					<input type="text" id="name" name="name" placeholder="Nom" required />
				</div>
				<div class="email">
					<!-- <label for="email">Email :</label> -->
					<input
						type="email"
						id="email"
						name="email"
						placeholder="Email"
						required
					/>
				</div>
				<div class="message">
					<!-- <label for="message">Message :</label> -->
					<textarea
						id="message"
						name="message"
						rows="5"
						cols="41"
						placeholder="Message"
						required
					></textarea>
				</div>
				<button type="submit">Envoyer</button>
			</form>
		</main>
		<footer>
			<p>© 2025 Arachon. Tous droits réservés.</p>
			<i class="fa-brands fa-facebook-f"></i>
			<i class="fa-brands fa-twitter"></i>
			<i class="fa-brands fa-instagram"></i>
		</footer>
	</body>
</html>
