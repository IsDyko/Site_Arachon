<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="medias/css/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700&family=Gabarito+SemiCondensed:wght@400;500;600;700&family=Gabarito+Condensed:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Arachon</title>
    <link
      rel="icon"
      href="medias/images/favicon-32x32.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <header>
      <nav>
        <img src="medias/images/logotrans.png" alt="logo" class="logo" />
        <div class="menu_choices">
          <ul>
            <li>Accueil</li>
            <li>Presentation</li>
            <li>Contact</li>
          </ul>
        </div>
        <div class="other_buttons">
          <button class="loc">
            <i class="fa-solid fa-location-dot"></i
            ><span>Trouver un concessionnaire</span>
          </button>
          <button class="signup"><i class="fa-solid fa-user"></i></button>
        </div>
      </nav>
    </header>
    <main>
      <div class="banner">
        <div class="desc_car">
          <h2>Sportivité et élegance jusqu'à la dernière ligne.</h2>
          <h3>La nouvelle Araco Sport à partir de 489.- par mois.¹</h3>
          <div class="buttons">
            <button class="discover">Découvrir maintenant</button>
            <button class="order">Commander</button>
          </div>
        </div>
      </div>
      <div class="square">
        <h2>TOUS NOS MODELES</h2>
      </div>
    </main>
  </body>
</html>
